<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Google 登入與資料庫示範</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
    button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
    .card { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>Firebase 分數系統</h2>

  <div id="auth-section">
    <button id="login-btn">使用 Google 登入</button>
    <button id="logout-btn" style="display: none;">登出</button>
  </div>

  <div id="user-info" class="card" style="display: none;">
    <h3>使用者資訊</h3>
    <p>姓名：<span id="user-name"></span></p>
    <p>UID：<span id="user-uid"></span></p>

    <hr>

    <h3>分數管理 (對應 scores/$uid 規則)</h3>
    <label for="score-input">輸入新分數：</label>
    <input type="number" id="score-input" placeholder="請輸入數字">
    <button id="save-score-btn">儲存分數</button>
    <button id="read-score-btn">讀取我的分數</button>

    <p>目前資料庫分數：<strong id="current-score">尚未讀取</strong></p>
  </div>

  <script type="module">
    // 1. 匯入所需的 SDK 模組
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      get 
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    // 2. Firebase 設定檔
    const firebaseConfig = {
      apiKey: "AIzaSyB2wAAQrplWWXR8r4feft1X6fjpV-omh_0",
      authDomain: "tttt-b6efa.firebaseapp.com",
      databaseURL: "https://tttt-b6efa-default-rtdb.firebaseio.com",
      projectId: "tttt-b6efa",
      storageBucket: "tttt-b6efa.firebasestorage.app",
      messagingSenderId: "1037464180661",
      appId: "1:1037464180661:web:a1b19e3420ee6e331debfc",
      measurementId: "G-HRL1XD4RZW"
    };

    // 3. 初始化 Firebase 服務
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // DOM 元素
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    const userNameSpan = document.getElementById("user-name");
    const userUidSpan = document.getElementById("user-uid");
    const scoreInput = document.getElementById("score-input");
    const saveScoreBtn = document.getElementById("save-score-btn");
    const readScoreBtn = document.getElementById("read-score-btn");
    const currentScoreSpan = document.getElementById("current-score");

    let currentUser = null;

    // 4. Google 登入事件
    loginBtn.addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          console.log("登入成功：", result.user.displayName);
        })
        .catch((error) => {
          console.error("登入失敗：", error.message);
          alert("登入失敗：" + error.message);
        });
    });

    // 5. 登出事件
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        console.log("已登出");
        currentScoreSpan.textContent = "尚未讀取";
        scoreInput.value = "";
      });
    });

    // 6. 監聽驗證狀態改變 (AuthState)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // 使用者已登入
        currentUser = user;
        userNameSpan.textContent = user.displayName;
        userUidSpan.textContent = user.uid;

        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        userInfo.style.display = "block";
      } else {
        // 使用者未登入 / 已登出
        currentUser = null;
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        userInfo.style.display = "none";
      }
    });

    // 7. 寫入分數至資料庫 (scores/$uid)
    saveScoreBtn.addEventListener("click", () => {
      if (!currentUser) return;

      const scoreVal = Number(scoreInput.value);
      if (isNaN(scoreVal)) {
        alert("請輸入有效的數字！");
        return;
      }

      // 建立對應此使用者的專屬節點路徑：scores/使用者UID
      const userScoreRef = ref(database, `scores/${currentUser.uid}`);

      set(userScoreRef, {
        score: scoreVal,
        updatedAt: new Date().toISOString()
      })
      .then(() => {
        alert("分數儲存成功！");
        currentScoreSpan.textContent = scoreVal;
      })
      .catch((error) => {
        console.error("寫入失敗：", error);
        alert("權限不足或寫入失敗！");
      });
    });

    // 8. 從資料庫讀取分數 (scores/$uid)
    readScoreBtn.addEventListener("click", () => {
      if (!currentUser) return;

      const userScoreRef = ref(database, `scores/${currentUser.uid}`);

      get(userScoreRef)
        .then((snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            currentScoreSpan.textContent = `${data.score} (更新時間: ${data.updatedAt})`;
          } else {
            currentScoreSpan.textContent = "尚無分數資料";
          }
        })
        .catch((error) => {
          console.error("讀取失敗：", error);
          alert("讀取失敗！");
        });
    });
  </script>

</body>
</html>
